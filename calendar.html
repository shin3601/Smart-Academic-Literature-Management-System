
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Calendar & Schedule | Smart Academic</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .calendar-section {
      background: #fffdf9;
      border: 1px solid #e8ddce;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    .calendar-section h2 {
      color: #6f4e37;
      margin-bottom: 14px;
    }

    .calendar-form {
      display: grid;
      gap: 14px;
    }

    .calendar-form label {
      display: block;
      font-weight: bold;
      color: #6f4e37;
      margin-bottom: 6px;
    }

    .calendar-form input,
    .calendar-form select,
    .calendar-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8c8b6;
      border-radius: 9px;
      font: inherit;
      color: #3b2921;
      background: white;
    }

    .calendar-form textarea {
      min-height: 85px;
      resize: vertical;
    }

    .calendar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .calendar-btn {
      padding: 11px 15px;
      border: none;
      border-radius: 9px;
      font: inherit;
      cursor: pointer;
      background: #6f4e37;
      color: white;
    }

    .calendar-btn.secondary {
      background: #e7d8c7;
      color: #493226;
    }

    .calendar-btn.danger {
      background: #a83c3c;
      color: white;
    }

    .calendar-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 20px;
    }

    .calendar-toolbar h2 {
      margin: 0;
      text-align: center;
      font-size: 20px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekday {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      padding: 8px 0;
      color: #806c5d;
    }

    .day-cell {
      min-width: 0;
      min-height: 62px;
      border: 1px solid #e8ddce;
      border-radius: 10px;
      background: #f7f2e8;
      color: #3b2921;
      font: inherit;
      cursor: pointer;
      padding: 6px 2px;
      text-align: center;
    }

    .day-cell .day-number {
      font-weight: bold;
      font-size: 14px;
    }

    .day-cell .day-marker {
      display: block;
      font-size: 10px;
      margin-top: 5px;
      overflow-wrap: anywhere;
    }

    .day-cell.holiday-day {
      background: #efdfcc;
    }

    .day-cell.no-class-day {
      background: #f0e4e1;
    }

    .day-cell.present-day {
      outline: 2px solid #79a688;
      outline-offset: -2px;
    }

    .day-cell.selected {
      border: 2px solid #6f4e37;
    }

    .calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 17px;
      font-size: 12px;
      color: #806c5d;
    }

    .legend-item {
      padding: 6px 10px;
      border: 1px solid #e4d5c3;
      border-radius: 10px;
    }

    .event-card {
      padding: 15px;
      background: #f7f2e8;
      border: 1px solid #e4d5c3;
      border-radius: 12px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .event-card h3 {
      color: #6f4e37;
      margin-bottom: 7px;
    }

    .event-card p {
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .event-category {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      margin: 6px 0;
      background: #e8dccb;
      font-size: 12px;
      font-weight: bold;
    }

    .calendar-muted {
      color: #806c5d;
      font-size: 14px;
      line-height: 1.6;
    }

    .calendar-message {
      margin: 14px 0;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .calendar-message.error {
      color: #a83c3c;
    }

    .calendar-message.success {
      color: #28734a;
    }

    .back-link {
      color: #6f4e37;
      font-weight: bold;
    }

    [hidden] {
      display: none !important;
    }

    @media(max-width:480px) {
      .calendar-section {
        padding: 15px;
      }

      .day-cell {
        min-height: 57px;
      }

      .calendar-toolbar h2 {
        font-size: 17px;
      }

      .calendar-toolbar .calendar-btn {
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body class="dashboard-page">

  <!-- NAVIGATION -->

  <header class="topbar">
    <div class="brand">
      ☕ Smart Academic
    </div>

    <button
      type="button"
      id="logoutBtn"
      class="logout-btn"
    >
      Logout
    </button>
  </header>

  <main class="dashboard-content">

    <p>
      <a
        href="student.html"
        id="backLink"
        class="back-link"
      >
        ← Back to Dashboard
      </a>
    </p>

    <section
      class="welcome-card"
      style="margin-top:20px;"
    >
      <h1>📅 Calendar & Schedule</h1>
      <p id="calendarWelcome">
        School schedules, holidays,
        and academic activities.
      </p>
    </section>

    <p
      id="calendarMessage"
      class="calendar-message"
      role="status"
      aria-live="polite"
    ></p>

    <!-- ADMIN EVENT FORM -->

    <section
      class="calendar-section"
      id="adminCalendarPanel"
      hidden
    >
      <h2 id="calendarFormTitle">
        Add Calendar Event
      </h2>

      <form
        id="calendarForm"
        class="calendar-form"
      >

        <div>
          <label for="eventTitle">
            Event / Class Name
          </label>
          <input
            type="text"
            id="eventTitle"
            maxlength="120"
            placeholder="Example: BSCS 3C - Programming"
            required
          >
        </div>

        <div>
          <label for="eventDate">
            Date
          </label>
          <input
            type="date"
            id="eventDate"
            required
          >
        </div>

        <div>
          <label for="eventCategory">
            Event Type
          </label>
          <select id="eventCategory" required>
            <option value="class">Class Schedule</option>
            <option value="exam">Examination</option>
            <option value="holiday">Holiday</option>
            <option value="no_class">No Classes</option>
            <option value="event">School Event</option>
          </select>
        </div>

        <div id="eventTimeFields">
          <div style="margin-bottom:12px;">
            <label for="eventStart">
              Start Time (Optional)
            </label>
            <input
              type="time"
              id="eventStart"
            >
          </div>

          <div>
            <label for="eventEnd">
              End Time (Optional)
            </label>
            <input
              type="time"
              id="eventEnd"
            >
          </div>
        </div>

        <div>
          <label for="eventDescription">
            Description (Optional)
          </label>
          <textarea
            id="eventDescription"
            placeholder="Add event details..."
          ></textarea>
        </div>

        <div class="calendar-actions">
          <button
            type="submit"
            id="saveEventBtn"
            class="calendar-btn"
          >
            Save Event
          </button>

          <button
            type="button"
            id="cancelEventBtn"
            class="calendar-btn secondary"
            hidden
          >
            Cancel Edit
          </button>
        </div>

      </form>
    </section>

    <!-- MONTHLY CALENDAR -->

    <section class="calendar-section">

      <div class="calendar-toolbar">
        <button
          type="button"
          id="prevMonthBtn"
          class="calendar-btn secondary"
          aria-label="Previous month"
        >
          ◀
        </button>

        <h2 id="monthLabel">
          Calendar
        </h2>

        <button
          type="button"
          id="nextMonthBtn"
          class="calendar-btn secondary"
          aria-label="Next month"
        >
          ▶
        </button>
      </div>

      <div
        id="calendarGrid"
        class="calendar-grid"
      ></div>

      <div class="calendar-legend">
        <span class="legend-item">📚 Class / Event</span>
        <span class="legend-item">🏖 Holiday</span>
        <span class="legend-item">🚫 No Class</span>
        <span class="legend-item">
          🟢 Recorded Attendance
        </span>
      </div>

      <p
        id="calendarHint"
        class="calendar-muted"
        style="margin-top:15px;"
      >
        Select a date to view its events.
      </p>

      <div class="calendar-actions">
        <button
          type="button"
          id="refreshCalendarBtn"
          class="calendar-btn"
        >
          Refresh Calendar
        </button>
      </div>

    </section>

    <!-- SELECTED DAY DETAILS -->

    <section class="calendar-section">
      <h2 id="selectedDayTitle">
        Selected Date
      </h2>

      <p
        id="selectedDayAttendance"
        class="calendar-muted"
      ></p>

      <div id="selectedDayEvents"></div>
    </section>

    <!-- MONTHLY EVENT LIST -->

    <section class="calendar-section">
      <h2>Events This Month</h2>

      <p id="monthlyEventCount"
         class="calendar-muted">
        Loading events...
      </p>

      <div id="monthlyEvents"></div>
    </section>

  </main>

  <!-- CALENDAR JAVASCRIPT -->

  <script
    type="module"
    src="calendar.js?v=1"
  ></script>

</body>
  </html>
